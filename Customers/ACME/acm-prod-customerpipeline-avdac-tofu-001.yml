##### ---------------------- HEADER ---------------------- #####

# Customer Azure DevOps Pipeline for OpenTofu Deployment (Starter)
# Authors: Michele Blum & Flavio Meyer
# Creation date: 31.05.2026

##### ---------------------- HEADER END ---------------------- #####

trigger: none
pr: none

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: operation
    displayName: Operation
    type: string
    default: deploy
    values:
      - deploy
      - destroy

variables:
  serviceConnection: 'duo-sc-devops-bicep-avdac-dev-002'              # Change to your customer service connection name
  tofuWorkingDir: '_Tofu'
  tfvarsFile: 'Customers/ACME/terraform.tfvars'
  providersFile: 'Customers/ACME/providers.tf'
  approvalNotifyUsers: ''                                         # Optional: user@domain.com or group alias for manual approval notifications

stages:
  - template: /_Tofu/_Pipelines/_Templates/AVD/tmpl-prod-customerpipeline-avdac-tofu-001.yml
    parameters:
      serviceConnection: ${{ variables.serviceConnection }}
      tofuWorkingDir: ${{ variables.tofuWorkingDir }}
      tfvarsFile: ${{ variables.tfvarsFile }}
      providersFile: ${{ variables.providersFile }}
      operation: ${{ parameters.operation }}
      approvalNotifyUsers: ${{ variables.approvalNotifyUsers }}
